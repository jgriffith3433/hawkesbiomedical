s John instead."],[33.72,36.76,"A piece can only look backward, never ahead."],[36.76,39.45,"And it has to know what order the pieces came in,"],[39.45,41.71,"or Mary and John would get mixed up."],[41.71,43.71,"There isn't just one looker."],[43.71,46.51,"This small model has one hundred and forty four,"],[46.51,48.68,"all looking for different things at once."],[48.68,51.599999999999994,"Most of them, nobody can explain yet."]],"dur":51.6},{"name":"recall","size":"3,072 lights a layer","sub":"the other half of every layer · each piece, alone, is topped up from what was learned · no drawer, no list: it is spread out","cues":[[0,1.5,"You turned the page."],[1.5,3.31,"I'm the other A.I."],[3.31,5.71,"On the front, pieces looked at each other."],[5.71,7.19,"Here is the opposite."],[7.19,10.55,"Each piece, all by itself, looking inward."],[10.55,11.73,"Finish this."],[11.73,13.39,"The opposite of hot is..."],[13.39,14.16,"Cold."],[14.16,15.93,"It just popped into your head."],[15.93,17.25,"You didn't look it up."],[17.25,19.4,"The machine has a step like that."],[19.4,23.55,"After the looking, every piece passes through thousands of little lights,"],[23.55,26.71,"and things the machine learned long ago get added on."],[26.71,27.86,"Hot goes in."],[27.86,29.93,"A little bit of cold comes out."],[29.93,33.61,"Most of this model's working numbers sit in these steps."],[33.61,37.05,"So is there a drawer inside, with cold in it?"],[37.05,38,"No."],[38,40.69,"Switch these steps off, one at a time,"],[40.69,43.93,"and most times, the answer is still there."],[43.93,49.47,"As far as anyone can tell, what a model knows isn't kept in one place."],[49.47,52.529999999999994,"It is spread across all of it."]],"dur":52.53}]};

  function now() { return CH.side() ? back() : front(); }
  function isOpen() { return box.classList.contains('open'); }
  function add(cls, text, tag) { var p = doc.createElement(tag || 'p'); p.className = cls; p.textContent = text; logE.appendChild(p); logE.scrollTop = 1e6; return p; }
  function setVoice() { vB.innerHTML = voice ? '&#128266;' : '&#128263;'; vB.className = voice ? '' : 'off'; vB.title = voice ? 'Answers are read aloud. Tap to turn that off.' : 'Answers are silent. Tap to hear them.'; vB.setAttribute('aria-label', vB.title); }
  function paint() { // everything that depends on which side is showing
    var s = CH.side(), lc = now().toLowerCase();
    btn.textContent = isOpen() ? 'Close the chat' : 'Ask about ' + lc; btn.classList.toggle('open', isOpen());
    $('askwho').textContent = 'The A.I. on this page'; $('askon').textContent = (s ? 'the back: ' : 'the front: ') + lc;
    inp.placeholder = 'Ask about ' + lc + '…';
    var qs = s ? ['What am I looking at?', 'Why is this the opposite?', 'Is that known for sure?'] : ['What am I looking at?', 'Are those numbers real?', 'Do you work like this too?'];
    chips.innerHTML = ''; qs.forEach(function (q) { var b = doc.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = function () { send(q); }; chips.appendChild(b); });
    if (!isOpen()) return;
    if (lastSide >= 0 && lastSide !== s) add('', (s ? 'you turned the page: now ' : 'you turned back: now ') + lc, 'i');
    if (!greeted[s]) {
      greeted[s] = true;
      add('ai', s ? 'Hello from the other side. As far as I can tell, you are now looking at ' + lc + ', which this page calls the opposite of ' + front().toLowerCase() + '. I find it a bit strange too. What are you wondering?'
        : 'Hi. I am the A.I. on this page. From what I can tell, you are looking at ' + lc + '. I do not know everything about it, but I like working it out. What would you like to know?');
    }
    lastSide = s;
  }
  function hushSay() { if (au) { au.pause(); au = null; } if (window.speechSynthesis) speechSynthesis.cancel(); }
  function show(on) { box.classList.toggle('open', on); paint(); if (on) { try { inp.focus({ preventScroll: true }); } catch (e) {} } else { hushSay(); if (rec) rec.abort(); } }
  function say(text, side) {
    hushSay(); if (!voice || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    var u = new SpeechSynthesisUtterance(text), en = /^en/i.test(navigator.language || 'en');
    if (en) { var vs = speechSynthesis.getVoices().filter(function (v) { return /^en/i.test(v.lang); }); if (vs.length) u.voice = vs[side ? Math.min(1, vs.length - 1) : 0]; }
    u.rate = 0.98; u.pitch = side ? 0.85 : 1.05; speechSynthesis.speak(u);
  }
  function send(text) {
    text = String(text || '').trim().slice(0, 400); if (!text || busy) return;
    busy = true; $('asks').disabled = true; inp.value = ''; CH.hush(); hushSay();
    var side = CH.side(), q = { role: 'user', content: text, side: side }; add('me', text); var b = add('ai wait', '');
    fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: D.key, side: side, messages: hist.slice(-12).concat([q]) }) })
      .then(function (r) {
        if (!r.ok) throw r.status; var rd = r.body.getReader(), dec = new TextDecoder(), all = '';
        return (function pump() { return rd.read().then(function (x) { if (x.done) return all; all += dec.decode(x.value, { stream: true }); b.textContent = all.split('\u001e')[0]; logE.scrollTop = 1e6; return pump(); }); })();
      })
      .then(function (all) { var p = all.split('\u001e'), t = p[0].trim(); if (!t) throw 0; b.textContent = t; hist.push(q, { role: 'assistant', content: t, side: side }); say(t, side); })
      .catch(function (e) { b.classList.add('err'); b.textContent = e === 429 ? 'I need a short rest: a lot of people are asking me things. Could you try again in a minute?' : 'Hmm, I lost my train of thought. Could you ask me that again?'; })
      .then(function () { busy = false; $('asks').disabled = false; b.classList.remove('wait'); logE.scrollTop = 1e6; });
  }
  btn.onclick = function () { show(!isOpen()); };
  $('askx').onclick = function () { show(false); };
  vB.onclick = function () { voice = !voice; if (!voice) hushSay(); setVoice(); };
  $('askf').onsubmit = function (e) { e.preventDefault(); send(inp.value); };
  box.addEventListener('keydown', function (e) { if (e.key === 'Escape') { show(false); btn.focus(); } });
  if (SR) micB.onclick = function () {
    if (rec) { rec.stop(); return; }
    CH.hush(); hushSay(); var r = rec = new SR(), heard = '';
    r.lang = navigator.language || 'en-US'; r.interimResults = true;
    r.onresult = function (e) { heard = ''; for (var i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript; inp.value = heard; };
    r.onerror = function (e) { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') add('ai err', 'I could not use the microphone. You can type to me instead.'); };
    r.onend = function () { if (rec === r) rec = null; micB.classList.remove('on'); if (heard.trim()) send(heard); };
    try { r.start(); micB.classList.add('on'); } catch (e) { rec = null; }
  };
  CH.onSide(function () { hushSay(); paint(); });
  setVoice(); paint();
}

var cv = document.getElementById('c'), cx = cv.getContext('2d'), W = 0, Hh = 0, dpr = 1, me = D.scales[D.i];
document.getElementById('k').innerHTML = 'Part ' + (D.i + 1) + ' of ' + D.scales.length + ' · <b>' + me.size + '</b>';
document.getElementById('name').textContent = me.name;
document.getElementById('sub').textContent = me.sub;
var QS = new URLSearchParams(location.search), CH = Chrome(D, QS.get('n') != null ? { fix: +QS.get('n'), go: QS.get('go') != null } : {}); // ?n=seconds holds the film at that moment (&go lets it run on from there)
function fit() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; Hh = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener('resize', fit); fit();
var last = performance.now(), T = 0, Tb = 0, inited = [false, false];
if (QS.get('flip') != null) CH.flip();
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - last) / 1000); last = now; var s = CH.side(), sc = s ? SCENE2 : SCENE;
  if (s) Tb += dt; else T += dt;
  if (!inited[s]) { inited[s] = true; sc.init(W, Hh); }
  cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;
  sc.draw(cx, W, Hh, s ? Tb : T, dt, CH.nt());
}
requestAnimationFrame(frame);
})();
